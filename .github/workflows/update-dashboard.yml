name: Update dashboard

on:
  schedule:
    - cron: "7,37 * * * *"   # backup timer, off the busy top of the hour. GitHub often delays/skips it.
  workflow_dispatch:          # run on demand: Actions tab, or the Kindle itself (see README)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one dashboard deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/render.mjs
        env:
          TZ: Europe/London   # so the date and "Updated" time are UK local time, not UTC
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
